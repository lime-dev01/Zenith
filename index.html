<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZÉNITH® — Extrêmes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="nav">
    <div class="nav__logo">ZÉNITH®</div>
  </header>

  <!-- La vidéo en fond (fixe) -->
  <video id="scroll-video" class="bg-video" muted playsinline preload="auto">
    <source src="assets/video.mp4" type="video/mp4" />
  </video>

  <!-- Overlay sombre pour la lisibilité du texte -->
  <div class="overlay"></div>

  <!-- Section 1 : Le Désert (Chaud) -->
  <section class="section section--warm">
    <div class="text-container fade-text-warm">
      <p class="subtitle">01 — Zone Aride</p>
      <h1 class="title title__warm">L'ÉCLAT<br>DU SOLEIL</h1>
      <p class="desc">Verres polarisés, monture en titane.<br>Conçu pour dominer la fournaise.</p>
    </div>
  </section>

  <!-- Section 2 : La Banquise (Froid) -->
  <section class="section section--cold">
    <div class="text-container text-container--right fade-text-cold">
      <p class="subtitle">02 — Zéro Absolu</p>
      <h1 class="title title__cold">L'INSTINCT<br>DU FROID</h1>
      <p class="desc">Vision panoramique, traitement anti-buée.<br>Dominez les sommets.</p>
    </div>
  </section>

  <!-- Indicateur de scroll -->
  <div class="scroll-hint">
    <span>DÉFILER POUR CHANGER DE CLIMAT</span>
    <div class="scroll-hint__bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
