<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUAL — Deux Mondes</title>
  <meta name="description" content="DUAL. L'équipement pour tous les extrêmes." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="nav__logo">DUAL®</div>
    <div class="nav__links">
      <span class="warm-text">SUN</span>
      <span class="divider">/</span>
      <span class="cold-text">SNOW</span>
    </div>
  </header>

  <!-- Section 1 : Chaud (Le désert / Lunettes) -->
  <section class="section section--warm">
    <h1 class="title">
      <span class="title__warm">SOLAIRE</span>
    </h1>
  </section>

  <!-- Section 2 : Froid (La glace / Masque) -->
  <section class="section section--cold">
    <h1 class="title">
      <span class="title__cold">POLAIRE</span>
    </h1>
  </section>

  <!-- Canvas 3D -->
  <canvas id="webgl"></canvas>

  <!-- Indicateur de scroll -->
  <div class="scroll-hint">
    <span>SCROLL TO SHIFT</span>
    <div class="scroll-hint__bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
