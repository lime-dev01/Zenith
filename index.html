<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZÉNITH® — Extrêmes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="nav__logo">ZÉNITH®</div>
  </header>

  <!-- Section 1 : Désert -->
  <section class="section">
    <div class="text-container fade-text-warm">
      <p class="subtitle">01 — Zone Aride</p>
      <h1 class="title title__warm">L'ÉCLAT<br>DU SOLEIL</h1>
      <p class="desc">Verres polarisés, monture en titane. Conçu pour dominer la fournaise.</p>
    </div>
  </section>

  <!-- Section 2 : Banquise -->
  <section class="section">
    <div class="text-container text-container--right fade-text-cold">
      <p class="subtitle">02 — Zéro Absolu</p>
      <h1 class="title title__cold">L'INSTINCT<br>DU FROID</h1>
      <p class="desc">Vision panoramique, traitement anti-buée. Dominez les sommets.</p>
    </div>
  </section>

  <canvas id="webgl"></canvas>

  <div class="scroll-hint">
    <span>DÉFILER</span>
    <div class="scroll-hint__bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="main.js"></script>

</html>
