<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZÉNITH® — L'Ingénierie</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="nav__logo">ZÉNITH®</div>
    <div class="nav__links">
      <a href="#tech">Technologie</a>
    </div>
  </header>

  <!-- SECTION : L'ÉCRIN TECHNIQUE -->
  <section class="scene-tech" id="tech">
    <div class="sticky-container">
      
      <!-- La vidéo générée sur Flow (Transition + Révélation) -->
      <video id="tech-video" class="tech-video" muted playsinline preload="auto">
        <source src="tech-transition.mp4" type="video/mp4" />
      </video>

      <!-- Les lignes techniques et textes (Cachés au début) -->
      <div class="tech-overlay">
        
        <!-- Lignes SVG -->
        <svg class="blueprint" viewBox="0 0 100 100" preserveAspectRatio="none">
          <!-- Côté Lunettes (Chaud) -->
          <path class="line line--warm" d="M 30 50 L 15 30" />
          <path class="line line--warm" d="M 35 55 L 20 75" />
          <!-- Côté Masque (Froid) -->
          <path class="line line--cold" d="M 70 50 L 85 30" />
          <path class="line line--cold" d="M 65 55 L 80 75" />
        </svg>

        <!-- Textes Techniques -->
        <div class="specs">
          <div class="spec spec--warm">
            <h3>Titane Aérospatial</h3>
            <p>Ultra-léger, ultra-résistant.</p>
          </div>
          <div class="spec spec--warm" style="top: 70%;">
            <h3>Verre Monobloc</h3>
            <p>Vision périphérique totale.</p>
          </div>

          <div class="spec spec--cold">
            <h3>Zéro Distorsion</h3>
            <p>Clarté optique absolue.</p>
          </div>
          <div class="spec spec--cold" style="top: 70%;">
            <h3>Filtre Cat. 4</h3>
            <p>Protection UV maximale.</p>
          </div>
        </div>

        <!-- Titre final -->
        <h2 class="tech-title">L'Ingénierie<br>de l'Extrême.</h2>

      </div>
    </div>
  </section>

  <!-- Espace pour scroller après -->
  <div style="height: 100vh; background: #050505;"></div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
